services:
  db:
    image: postgres:18
    container_name: chat-history-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat_history
    ports:
      - "5435:5432"
    volumes:
      # postgres 18+ keeps PGDATA in a versioned subdirectory of /var/lib/postgresql
      - chat-history-pgdata:/var/lib/postgresql

volumes:
  chat-history-pgdata:
